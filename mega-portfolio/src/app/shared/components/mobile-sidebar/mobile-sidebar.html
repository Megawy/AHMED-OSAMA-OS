<div class="mobile-sidebar-container" [class.open]="isOpen">
  <!-- Overlay Backdrop -->
  <div class="backdrop" (click)="onClose()"></div>

  <!-- Drawer Menu Content -->
  <aside class="drawer" [class.rtl]="languageService.isRtl()">
    <div class="drawer-header">
      <a routerLink="/" class="logo" (click)="onClose()">
        <span class="logo-mark">&lt;/&gt;</span>
        <span>AHMED OSAMA</span>
      </a>

      <button type="button" class="close-btn" (click)="onClose()" aria-label="Close menu">
        ✕
      </button>
    </div>

    <nav class="drawer-nav">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="onClose()"
      >
        {{ 'NAV.HOME' | translate }}
      </a>

      <a
        routerLink="/architecture"
        routerLinkActive="active"
        (click)="onClose()"
      >
        {{ 'NAV.ARCHITECTURE' | translate }}
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        (click)="onClose()"
      >
        {{ 'NAV.PROJECTS' | translate }}
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active"
        (click)="onClose()"
      >
        {{ 'NAV.CONTACT' | translate }}
      </a>
    </nav>

    <div class="drawer-footer">
      <app-language-switcher></app-language-switcher>

      <button type="button" class="resume-btn" (click)="onClose()">
        {{ 'NAV.RESUME' | translate }}
      </button>
    </div>
  </aside>
</div>
