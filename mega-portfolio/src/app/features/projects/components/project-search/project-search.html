<section class="project-search">
  <div class="search-box">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>

    <input type="search" [ngModel]="search()" (ngModelChange)="search.set($event)"
      placeholder="Search projects, technologies..." aria-label="Search projects" />

    @if (search()) {
    <button type="button" class="clear" (click)="clear()" aria-label="Clear search">
      ✕
    </button>
    }
  </div>

  @if (resultCount() > 0 && !isLoading()) {
  <p class="result-count">
    {{ resultCount() }} project{{ resultCount() === 1 ? '' : 's' }} found
  </p>
  }
</section>
