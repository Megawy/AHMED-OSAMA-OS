<section class="redis-section">
    <div class="section-inner">
        <div class="redis-visual reveal">
            <div class="cache-diagram">
                <div class="cache-layer">
                    <span class="layer-label">L1 - Local Cache</span>
                    <div class="cache-bar bar-fast"></div>
                </div>
                <div class="cache-layer">
                    <span class="layer-label">L2 - Redis Cluster</span>
                    <div class="cache-bar bar-medium"></div>
                </div>
                <div class="cache-layer">
                    <span class="layer-label">L3 - Database</span>
                    <div class="cache-bar bar-slow"></div>
                </div>
            </div>
        </div>

        <div class="redis-content reveal">
            <span class="section-badge">Distributed Cache</span>
            <h2>{{ 'ARCH.REDIS_TITLE' | translate }}</h2>
            <p>{{ 'ARCH.REDIS_DESC' | translate }}</p>

            <div class="redis-stats">
                <div class="stat-item">
                    <span class="stat-value">&lt;1ms</span>
                    <span class="stat-label">Read Latency</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">100K+</span>
                    <span class="stat-label">Ops/sec</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">99.9%</span>
                    <span class="stat-label">Hit Rate</span>
                </div>
            </div>
        </div>
    </div>
</section>
