<section class="arch-hero">
    <div class="hero-content">
        <span class="badge">{{ 'ARCH.HERO_TAG' | translate }}</span>

        <h1>{{ 'ARCH.HERO_TITLE' | translate }}</h1>

        <p>{{ 'ARCH.HERO_SUBTITLE' | translate }}</p>

        <div class="hero-stats">
            <div class="stat">
                <h2>8+</h2>
                <span>{{ 'ARCH.STAT_SERVICES' | translate }}</span>
            </div>
            <div class="stat">
                <h2>99.9%</h2>
                <span>{{ 'ARCH.STAT_UPTIME' | translate }}</span>
            </div>
            <div class="stat">
                <h2>10K+</h2>
                <span>{{ 'ARCH.STAT_RPS' | translate }}</span>
            </div>
        </div>
    </div>

    <div class="hero-visual">
        <div class="orbit-container">
            <div class="orbit-center">
                <span class="center-icon">⚙️</span>
                <span class="center-label">Core</span>
            </div>
            <div class="orbit-ring ring-1">
                <div class="orbit-node node-1">🌐</div>
                <div class="orbit-node node-2">🔐</div>
                <div class="orbit-node node-3">📡</div>
            </div>
            <div class="orbit-ring ring-2">
                <div class="orbit-node node-4">⚡</div>
                <div class="orbit-node node-5">📦</div>
                <div class="orbit-node node-6">💳</div>
            </div>
        </div>
    </div>
</section>
