<article class="card">

  <div class="cover">

    @if (project.coverImage) {

    <img [src]="project.coverImage" [alt]="project.title" loading="lazy">

    } @else {

    <span class="cover-fallback" aria-hidden="true">{{ project.title.charAt(0) }}</span>

    }

    @if(project.featured){

    <span class="featured">

      Featured

    </span>

    }

  </div>

  <div class="body">

    <h2>

      {{project.title}}

    </h2>

    <p>

      {{project.shortDescription}}

    </p>

    <div class="stack">

      @for(tech of project.technologies; track tech){

      <span>

        {{techLabel(tech)}}

      </span>

      }

    </div>

  </div>

</article>
