<section class="practices-section">
    <div class="section-header reveal">
        <span class="section-badge">Engineering Excellence</span>
        <h2>{{ 'ARCH.PRACTICES_TITLE' | translate }}</h2>
        <p>{{ 'ARCH.PRACTICES_DESC' | translate }}</p>
    </div>

    <div class="practices-grid reveal">
        @for (practice of practices; track practice.title) {
        <div class="practice-card">
            <span class="practice-icon">{{ practice.icon }}</span>
            <h3>{{ practice.title }}</h3>
            <p>{{ practice.description }}</p>
        </div>
        }
    </div>
</section>
