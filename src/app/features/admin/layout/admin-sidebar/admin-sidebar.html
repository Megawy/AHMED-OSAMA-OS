<aside class="sidebar" [class.open]="open" role="navigation" aria-label="Admin navigation">
    <div class="sidebar-header">
        <a routerLink="/admin" class="logo" (click)="onClose()">
            <span class="logo-mark">&lt;/&gt;</span>
            <span class="logo-text">ADMIN</span>
        </a>
        <button class="close-btn" (click)="onClose()" aria-label="Close sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav">
        @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" [routerLinkActive]="'active'" [routerLinkActiveOptions]="{ exact: item.exact }"
            (click)="onClose()" class="nav-link" [attr.aria-label]="item.label">
            <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
        </a>
        }
    </nav>

    <div class="sidebar-footer">
        <div class="user-info">
            @if (admin(); as adminUser) {
            <div class="user-avatar" aria-hidden="true">{{ adminUser.email.charAt(0) | uppercase }}</div>
            <div class="user-details">
                <span class="user-email">{{ adminUser.email }}</span>
                <span class="user-role">{{ adminUser.role }}</span>
            </div>
            }
        </div>
        <button class="logout-btn" (click)="onLogout()" aria-label="Logout">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Logout</span>
        </button>
    </div>
</aside>
