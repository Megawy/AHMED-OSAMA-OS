<header class="navbar" [class.scrolled]="isScrolled">
  <div class="container">
    <a routerLink="/" class="logo">
      <span class="logo-mark">&lt;/&gt;</span>
      <span>AHMED OSAMA</span>
    </a>

    <nav class="desktop-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        {{ 'NAV.HOME' | translate }}
      </a>
      <a routerLink="/architecture" routerLinkActive="active">
        {{ 'NAV.ARCHITECTURE' | translate }}
      </a>
      <a routerLink="/projects" routerLinkActive="active">
        {{ 'NAV.PROJECTS' | translate }}
      </a>
      <a routerLink="/contact" routerLinkActive="active">
        {{ 'NAV.CONTACT' | translate }}
      </a>
    </nav>

    <div class="nav-actions">
      <app-language-switcher class="desktop-lang-switcher"></app-language-switcher>

      @if (resumeUrl()) {
      <a class="resume-btn" [href]="resumeUrl()" target="_blank" rel="noopener noreferrer">
        {{ 'NAV.RESUME' | translate }}
      </a>
      }

      <button
        type="button"
        class="menu-btn"
        (click)="onToggleSidebar()"
        aria-label="Toggle Navigation Menu"
      >
        <span class="menu-icon">☰</span>
      </button>
    </div>
  </div>
</header>
