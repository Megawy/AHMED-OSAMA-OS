<div class="error-state">
  @if (image) {
    <img class="illustration" [src]="image" alt="" aria-hidden="true" />
  } @else {
    <span class="icon">⚠</span>
  }
  <h3>Something went wrong</h3>
  <p>{{ message }}</p>
  <button type="button" class="retry" (click)="onRetry()">
    {{ retryLabel }}
  </button>
</div>
