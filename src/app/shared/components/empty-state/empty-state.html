<div class="empty-state">
  @if (image) {
    <img class="illustration" [src]="image" alt="" aria-hidden="true" />
  } @else {
    <span class="icon">{{ icon }}</span>
  }
  <h3>{{ title }}</h3>
  <p>{{ message }}</p>

  @if (actionLabel) {
    <button type="button" class="action" (click)="onAction()">
      {{ actionLabel }}
    </button>
  }
</div>
